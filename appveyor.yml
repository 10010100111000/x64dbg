version: 1.0.{build}

image: Visual Studio 2013

environment:
  matrix:
    - ARCH: x64
      PLATFORM: x64
      CONFIGURATION: Release
      QT_SPEC: win32-msvc2013  # Qt 的 spec 配置
      QT_BIN: C:\Qt\5.6.3\msvc2013_64\bin  # Qt 工具链路径

clone_folder: c:\projects\x64dbg

install:
  - git submodule update --init --recursive

before_build:
  - if exist bin rmdir /s /q bin  # 清理旧的构建目录
  - set PATH=%QT_BIN%;%PATH%  # 将 Qt 工具链添加到 PATH
  - qmake --version  # 验证 Qt 是否可用

build_script:
  # 1. 构建主项目（非 Qt 部分）
  - echo Building DBG for %ARCH%...
  - msbuild.exe x64dbg.sln /m /verbosity:minimal /t:Rebuild /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM%

  # 2. 构建 Qt 项目（src\gui\x64dbg.pro）
  - echo Building Qt GUI...
  - cd src\gui
  - qmake x64dbg.pro -spec %QT_SPEC% -r CONFIG+=release  # 生成 Makefile
  - nmake  # 编译 Qt 项目
  - cd ..\..

after_build:
  - echo Listing all build outputs...
  - dir /s /b bin  # 列出所有生成的文件

artifacts:
  # 主项目生成的文件
  - path: bin\x64\Release\x64dbg.exe
    name: x64dbg.exe
  - path: bin\x64\Release\x64dbg.dll
    name: x64dbg.dll
  - path: bin\x64\Release\loaddll.exe
    name: loaddll.exe
  - path: bin\x64\Release\zydis_wrapper.lib
    name: zydis_wrapper.lib
  - path: bin\x64\Release\x64bridge.dll
    name: x64bridge.dll

  # Qt 项目生成的文件（假设生成到 src\gui\release）
  - path: src\gui\release\x64dbg_gui.exe  # 替换为实际生成的 Qt 可执行文件名
    name: x64dbg_gui.exe

  # 通配符匹配其他文件
  - path: bin\x64\*.exe
    name: x64_Executables
  - path: bin\x64\*.dll
    name: x64_Libraries
  - path: bin\x64\*.lib
    name: x64_StaticLibraries
