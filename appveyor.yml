version: 1.0.{build}

image: Visual Studio 2013

environment:
  matrix:
    - ARCH: x64
      PLATFORM: x64
      CONFIGURATION: Release

clone_folder: c:\projects\x64dbg

install:
  - git submodule update --init --recursive
before_build:
  - if exist bin rmdir /s /q bin
build_script:
  - echo Building DBG for %ARCH%...
  - msbuild.exe x64dbg.sln /m /verbosity:minimal /t:Rebuild /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM%
  after_build:
  - dir /s /b bin
artifacts:
  - path: bin\x64\*.exe
    name: x64_Executables
  - path: bin\x64\*.dll
    name: x64_Libraries
  - path: bin\x64\*.lib
    name: x64_StaticLibraries
