version: 1.0.{build}

image: Visual Studio 2013

platform:
  - x86
  - x64

configuration:
  - Release

clone_folder: c:\projects\x64dbg

install:
  - git submodule update --init --recursive

build_script:
  - msbuild x64dbg.sln /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM%

artifacts:
  - path: bin\x64\Release
    name: x64_Release
  - path: bin\x32\Release
    name: x32_Release
