version: 1.0.{build}

image: Visual Studio 2013

environment:
  matrix:
    - ARCH: x32
      PLATFORM: Win32
      CONFIGURATION: Release
    - ARCH: x64
      PLATFORM: x64
      CONFIGURATION: Release

clone_folder: c:\projects\x64dbg

install:
  - git submodule update --init --recursive

build_script:
  - echo Building DBG for %ARCH%...
  - msbuild.exe x64dbg.sln /m /verbosity:minimal /t:Rebuild /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM%

artifacts:
  - path: C:\projects\x64dbg\bin\Win32\Release\*
    name: Win32_Release
  - path: C:\projects\x64dbg\bin\x64\Release\*
    name: x64_Release
