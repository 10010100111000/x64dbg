version: 1.0.{build}

image: Visual Studio 2013

environment:
  type: "Release"  # 你可以根据需要更改为 "Debug"

platform:
  - x86
  - x64

configuration:
  - Release
  - Debug

build_script:
  - msbuild.exe x64dbg.sln /m:1 /verbosity:minimal /t:Rebuild /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM%

artifacts:
  - path: '**\$(Configuration)\$(Platform)\*.exe'
    name: x64dbg

test: off

deploy: offversion: 1.0.{build}
image: Visual Studio 2013

platform:
  - x64

build:
  verbosity: normal
  commands:
    - call "%VS120COMNTOOLS%\vsvars32.bat"
    - msbuild x64dbg.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v120

test:
  test_script:
    - cmd: echo "No tests to run"
