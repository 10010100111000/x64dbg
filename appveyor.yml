version: 1.0.{build}

image: Visual Studio 2013

environment:
  matrix:
    - ARCH: x64
      PLATFORM: x64
      CONFIGURATION: Release
      QT_SPEC: win32-msvc2013   # Qt 的 spec 配置
      QT_BIN: C:\Qt\5.6.3\msvc2013_64\bin  # Qt 工具链路径

clone_folder: c:\projects\x64dbg

install:
  - dir C:\Qt\5.6\msvc2013_64\bin
  - C:\Program Files (x86)
  - git submodule update --init --recursive

before_build:
  - if exist bin rmdir /s /q bin  # 清理旧的构建目录
  - set PATH=C:\Qt\5.6\msvc2013_64\bin;%PATH%  # 将 Qt 工具链添加到 PATH
  - set PATH=C:\Program Files (x86)\Microsoft Visual Studio 12.0\VC\bin\;%PATH% 
  - qmake --version  # 验证 Qt 是否可用
  - nmake --version
build_script:
  # 1. 构建主项目（非 Qt 部分）
  - echo Building DBG for %ARCH%...
  - msbuild.exe x64dbg.sln /m /verbosity:minimal /t:Rebuild /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM%

  # 2. 构建 Qt 项目（src\gui\x64dbg.pro）
  - echo Building Qt GUI...
  - cd src\gui
  - qmake x64dbg.pro -spec %QT_SPEC% -r CONFIG+=release  # 生成 Makefile
  - jom
  - cd ..\..

after_build:
  - echo Listing all build outputs...
  - dir /s /b bin  # 列出所有生成的文件
  - dir /s /b src\gui  # 列出 Qt 项目生成的所有文件（用于捕获 Qt 项目输出）
artifacts:
  # 主项目生成的文件
  - path: bin\x64\Release\x64dbg.exe
    name: x64dbg.exe
  - path: bin\x64\Release\x64dbg.dll
    name: x64dbg.dll
  - path: bin\x64\Release\loaddll.exe
    name: loaddll.exe
  - path: bin\x64\Release\zydis_wrapper.lib
    name: zydis_wrapper.lib
  - path: bin\x64\Release\x64bridge.dll
    name: x64bridge.dll

# Qt 项目生成的所有文件
  - path: src\gui\*.exe
    name: Qt_Executables
  - path: src\gui\*.dll
    name: Qt_Libraries
  - path: src\gui\*.lib
    name: Qt_StaticLibraries
  - path: src\gui\release\*  # 捕获 Qt 项目可能的生成文件
    name: Qt_Release_Files
  - path: src\gui\debug\*  # 如果生成了 debug 文件，捕获它们
    name: Qt_Debug_Files

  # 通配符匹配其他文件
  - path: bin\x64\*.exe
    name: x64_Executables
  - path: bin\x64\*.dll
    name: x64_Libraries
  - path: bin\x64\*.lib
    name: x64_StaticLibraries
