version: 1.0.{build}

image: Visual Studio 2013

environment:
  matrix:
    - ARCH: x64
      PLATFORM: x64
      CONFIGURATION: Release

clone_folder: c:\projects\x64dbg

install:
  - git submodule update --init --recursive

build_script:
  - echo Building DBG for %ARCH%...
  - msbuild.exe x64dbg.sln /m /verbosity:minimal /t:Rebuild /p:Configuration=%CONFIGURATION% /p:Platform=%PLATFORM%
  - echo "Checking if output directory exists..."
  - dir bin\x64\Release
artifacts:
  - path: bin\x64\Release\x64dbg.exe
    name: x64dbg.exe
  - path: bin\x64\Release\x64dbg.dll
    name: x64dbg.dll
  - path: bin\x64\Release\loaddll.exe
    name: loaddll.exe
  - path: bin\x64\Release\zydis_wrapper.lib
    name: zydis_wrapper.lib
  - path: bin\x64\Release\x64bridge.dll
    name: x64bridge.dll
